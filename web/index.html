<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrarium — live diorama</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <button id="loreBtn" title="Lore archives">📖 <span class="lore-label">Lore</span></button>
    <div id="hudCenter">
      <span id="title">🌿 connecting…</span>
      <div id="gauges">
        <span class="gauge" id="gCampfire" title="Campfire"><b>🔥</b><span class="track"><span class="fill"></span></span></span>
        <span class="gauge" id="gShelter" title="Shelter"><b>🏕️</b><span class="track"><span class="fill"></span></span></span>
      </div>
    </div>
    <div id="stock">
      <span class="chip" id="sWood" title="Wood stockpile">🪵 0</span>
      <span class="chip" id="sFood" title="Food stockpile">🍎 0</span>
      <span class="chip" id="sStone" title="Stone (colony-wide rucksacks)">🪨 0</span>
      <span class="chip" id="sFiber" title="Fiber (colony-wide rucksacks)">🧶 0</span>
      <span id="conn" class="off">○ offline</span>
    </div>
    <button id="rosterBtn" title="Colonist roster">👥</button>
  </div>

  <div id="wrap">
    <div id="stage">
      <canvas id="island" width="1100" height="900"></canvas>
      <div id="sprites"></div>
      <div id="emotes"></div>
      <div id="chat" class="hidden"></div>
      <div id="log"></div>
    </div>
  </div>

  <aside id="dossier" class="panel hidden">
    <div class="panel-head"><b>👤 Dossier</b><button class="close" id="dossierClose" title="Close">✕</button></div>
    <div id="dossierBody"></div>
  </aside>

  <aside id="roster" class="panel">
    <div class="panel-head"><b>👥 Colonists</b><button class="close" id="rosterClose" title="Close">✕</button></div>
    <div id="rosterBody"></div>
  </aside>

  <aside id="lore" class="panel hidden">
    <div class="panel-head"><b>📖 Lore Archives</b><button class="close" id="loreClose" title="Close">✕</button></div>
    <div id="loreTabs">
      <button class="tab active" data-tab="graveyard">🪦 Graves</button>
      <button class="tab" data-tab="monument">🗿 Monolith</button>
      <button class="tab" data-tab="chronicle">📜 Chronicle</button>
      <button class="tab" data-tab="patches">⚙️ Patches</button>
    </div>
    <div id="loreBody"></div>
  </aside>

  <div id="zoomCtl">
    <button id="zoomIn" title="Zoom in">＋</button>
    <button id="zoomReset" title="Reset view">⤢</button>
    <button id="zoomOut" title="Zoom out">－</button>
  </div>

  <script src="sprites.js"></script>
  <script src="atlas.js"></script>
  <script src="objects.js"></script>
  <script src="app.js"></script>
</body>
</html>
